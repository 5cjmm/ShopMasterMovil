name: Compilar APK

# Se ejecuta a mano (Actions > Compilar APK > Run workflow, eligiendo la rama)
# o cuando se sube una etiqueta que empiece por "v" (por ejemplo v1.0.0),
# en cuyo caso además publica el APK en Releases.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Verificar la URL del backend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "Falta la variable API_BASE_URL (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilar el APK contra el backend real
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: >
          flutter build apk --release
          --android-skip-build-dependency-validation
          --dart-define=USE_MOCK=false
          --dart-define=API_BASE_URL=$API_BASE_URL

      - name: Guardar el APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: shopmaster-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar en Releases (solo con etiqueta)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
